<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Page Not Found | Novara Capital</title>
  <meta name="description" content="The page you were looking for doesn't exist. Return to Novara Capital.">
  <link rel="icon" type="image/svg+xml" href="../favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../styles.css">
  <style>
    body { display: flex; flex-direction: column; min-height: 100vh; }
    .not-found {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 80px 24px;
      background: linear-gradient(to bottom, #F0FDF4, #FFFFFF);
      text-align: center;
    }
    .not-found-inner { max-width: 560px; }
    .error-code {
      font-size: clamp(6rem, 20vw, 10rem);
      font-weight: 800;
      color: #10B981;
      line-height: 1;
      margin-bottom: 16px;
      letter-spacing: -4px;
    }
    .not-found h1 {
      font-size: 2rem;
      font-weight: 700;
      color: #0B251A;
      margin-bottom: 16px;
    }
    .not-found p {
      font-size: 1.05rem;
      color: #6B7280;
      line-height: 1.7;
      margin-bottom: 40px;
    }
    .not-found-btns {
      display: flex;
      gap: 16px;
      justify-content: center;
      flex-wrap: wrap;
    }
    .btn-ghost {
      padding: 12px 28px;
      border: 1.5px solid #E5E7EB;
      border-radius: 100px;
      color: #374151;
      text-decoration: none;
      font-weight: 600;
      font-size: 0.95rem;
      transition: border-color 0.2s, background 0.2s;
    }
    .btn-ghost:hover { border-color: #10B981; background: #F0FDF4; color: #0B251A; }
  </style>
</head>
<body>
  <section class="not-found">
    <div class="not-found-inner">
      <div class="error-code">404</div>
      <h1>This page doesn't exist.</h1>
      <p>The page you're looking for may have been moved, deleted, or never existed. Let's get you back on track.</p>
      <div class="not-found-btns">
        <a href="../index/index.html" class="btn-get-started">Go to Homepage</a>
        <a href="../investments/investments.html" class="btn-ghost">Browse Investments</a>
      </div>
    </div>
  </section>
</body>
</html>
