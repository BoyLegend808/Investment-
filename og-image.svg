<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <!-- Background gradient -->
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0E5E3A;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1a8a5a;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="goldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFD700;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FFA500;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bgGradient)" />

  <!-- Decorative circles -->
  <circle cx="100" cy="100" r="150" fill="#FFD700" opacity="0.1" />
  <circle cx="1100" cy="530" r="200" fill="#FFD700" opacity="0.1" />
  <circle cx="600" cy="315" r="300" fill="#FFD700" opacity="0.05" />

  <!-- Logo mark -->
  <g transform="translate(80, 80)">
    <path d="M50 20 L20 40 L50 60 L80 40 Z" fill="url(#goldGradient)" />
    <path d="M20 40 L20 70 L50 90 L50 60" fill="#FFD700" opacity="0.8" />
    <path d="M80 40 L80 70 L50 90" fill="#FFA500" opacity="0.8" />
  </g>

  <!-- Main text -->
  <text x="600" y="280" font-family="Inter, sans-serif" font-size="72" font-weight="700" fill="#FFFFFF" text-anchor="middle">Crest Wealth</text>

  <!-- Tagline -->
  <text x="600" y="350" font-family="Inter, sans-serif" font-size="32" font-weight="400" fill="#FFD700" text-anchor="middle">Grow Your Wealth with Confidence</text>

  <!-- Subtext -->
  <text x="600" y="420" font-family="Inter, sans-serif" font-size="24" font-weight="300" fill="#FFFFFF" text-anchor="middle" opacity="0.9">High-Yield Savings • Global Investments • Smart Portfolio Management</text>

  <!-- Trust badges -->
  <g transform="translate(300, 520)">
    <rect x="0" y="0" width="200" height="50" rx="8" fill="#FFFFFF" opacity="0.1" />
    <text x="100" y="32" font-family="Inter, sans-serif" font-size="16" font-weight="500" fill="#FFD700" text-anchor="middle">SEC Registered</text>
  </g>

  <g transform="translate(700, 520)">
    <rect x="0" y="0" width="200" height="50" rx="8" fill="#FFFFFF" opacity="0.1" />
    <text x="100" y="32" font-family="Inter, sans-serif" font-size="16" font-weight="500" fill="#FFD700" text-anchor="middle">Bank-Grade Security</text>
  </g>

  <!-- URL -->
  <text x="600" y="590" font-family="Inter, sans-serif" font-size="18" font-weight="400" fill="#FFFFFF" text-anchor="middle" opacity="0.7">crestwealth.com</text>
</svg>